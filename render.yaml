services:
  - type: web
    name: spillburg-logistics1
    env: docker
    plan: free
    region: singapore
    dockerfilePath: ./Dockerfile
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: false
      - key: DB_CONNECTION
        value: sqlite
      - key: SITE_CONTACT_EMAIL
        value: info@spillburglogistics1.com
      - key: QUOTE_NOTIFICATIONS_EMAIL
        value: info@spillburglogistics1.com

